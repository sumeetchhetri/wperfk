name: release

on:
  push:
    tags: ['v*']
  # Dry run: builds, tests and packages everything; publishes nothing.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  OPENSSL_VERSION: 3.5.8   # keep in sync with tools/build-openssl.sh
  MACOSX_DEPLOYMENT_TARGET: '11.0'

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,  arch: amd64, runner: ubuntu-24.04 }
          - { os: linux,  arch: arm64, runner: ubuntu-24.04-arm }
          - { os: darwin, arch: amd64, runner: macos-15-intel }
          - { os: darwin, arch: arm64, runner: macos-15 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build (Linux, static musl)
        if: matrix.os == 'linux'
        run: |
          docker run --rm -e VERSION -v "$PWD:/src" -w /src alpine:3.22 sh -ec '
            apk add --no-cache build-base perl linux-headers git openssl-dev openssl-libs-static
            git config --global --add safe.directory "*"
            make -j4 STATIC=1 VERSION="$VERSION"'
          file wperfk

      # Homebrew's OpenSSL targets the runner's macOS; build our own for 11.0+.
      - name: Cache OpenSSL (macOS)
        if: matrix.os == 'darwin'
        uses: actions/cache@v4
        with:
          path: ~/openssl
          key: openssl-${{ env.OPENSSL_VERSION }}-macos${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ matrix.arch }}-v1

      - name: Build (macOS 11+, static OpenSSL)
        if: matrix.os == 'darwin'
        run: |
          set -o pipefail
          tools/build-openssl.sh "$HOME/openssl" "-mmacosx-version-min=$MACOSX_DEPLOYMENT_TARGET"
          make -j4 STATIC=1 VERSION="$VERSION" WITH_OPENSSL="$HOME/openssl" 2>&1 | tee build.log
          if grep -q "built for newer" build.log; then
            echo "::error::linked objects built for a newer macOS than $MACOSX_DEPLOYMENT_TARGET"; exit 1
          fi
          otool -L wperfk
          if otool -L wperfk | grep -e homebrew -e /usr/local/opt -e /usr/local/lib; then
            echo "::error::binary links against non-system libraries"; exit 1
          fi
          minos=$(otool -l wperfk | awk '/LC_BUILD_VERSION/{f=1} f && $1=="minos" {print $2; exit}')
          echo "minos=$minos"
          if [ "$minos" != "$MACOSX_DEPLOYMENT_TARGET" ]; then
            echo "::error::binary requires macOS $minos, expected $MACOSX_DEPLOYMENT_TARGET"; exit 1
          fi

      - name: Smoke test
        run: tests/smoke.sh ./wperfk

      - name: Package
        run: tools/package.sh "$VERSION" "${{ matrix.os }}" "${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: wperfk-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  darwin-universal:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: wperfk-darwin-*
          path: in
          merge-multiple: true

      - name: lipo amd64 + arm64
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p x86 arm
          tar -xzf "in/wperfk_${VERSION}_darwin_amd64.tar.gz" -C x86
          tar -xzf "in/wperfk_${VERSION}_darwin_arm64.tar.gz" -C arm
          lipo -create -output wperfk x86/wperfk arm/wperfk
          lipo -archs wperfk
          tools/package.sh "$VERSION" darwin universal

      - uses: actions/upload-artifact@v4
        with:
          name: wperfk-darwin-universal
          path: dist/*

  build-windows:
    name: windows-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: windows-2025,   msystem: UCRT64,     cc: gcc }
          - { arch: arm64, runner: windows-11-arm, msystem: CLANGARM64, cc: clang }
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: make git zip
          pacboy: toolchain:p openssl:p python:p

      - name: Build, test, package
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          make -j4 STATIC=1 CC=${{ matrix.cc }} VERSION="$VERSION"
          ./wperfk.exe -v
          OD=$(command -v objdump || command -v llvm-objdump)
          if "$OD" -p wperfk.exe | grep "DLL Name" | grep -iE "libssl|libcrypto|libwinpthread|libgcc|libc\+\+"; then
            echo "::error::wperfk.exe depends on non-system DLLs"; exit 1
          fi
          tests/smoke.sh ./wperfk.exe
          tools/package.sh "$VERSION" windows ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: wperfk-windows-${{ matrix.arch }}
          path: dist/*

  # Tier 2: published when it succeeds, never blocks the release.
  build-freebsd:
    name: freebsd-amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - uses: vmactions/freebsd-vm@v1
        with:
          release: '14'
          prepare: pkg install -y gmake bash python3 git
          run: |
            set -e
            git config --global --add safe.directory '*'
            VERSION=${GITHUB_REF_NAME#v}
            gmake -j2 STATIC=1 VERSION="$VERSION"
            file wperfk
            bash tests/smoke.sh ./wperfk
            bash tools/package.sh "$VERSION" freebsd amd64

      - uses: actions/upload-artifact@v4
        with:
          name: wperfk-freebsd-amd64
          path: dist/*

  release:
    needs: [build, darwin-universal, build-windows, build-freebsd]
    if: >-
      ${{ !cancelled() &&
          needs.build.result == 'success' &&
          needs.darwin-universal.result == 'success' &&
          needs.build-windows.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          [ "${{ needs.build-freebsd.result }}" = success ] || echo "::warning::FreeBSD build failed; releasing without it"
          VERSION=${GITHUB_REF_NAME#v}
          cd dist && sha256sum wperfk_* > "wperfk_${VERSION}_checksums.txt"
          cat "wperfk_${VERSION}_checksums.txt"

      - name: Upload dry-run bundle
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: wperfk-release-dry-run
          path: dist/*

      - uses: actions/attest-build-provenance@v2
        if: github.event_name == 'push'
        with:
          subject-path: dist/wperfk_*

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes $pre

  # Stable tags only: refresh Formula/ (Homebrew) and bucket/ (Scoop) on main,
  # and open a winget-pkgs PR when a WINGET_TOKEN secret is configured.
  packages:
    needs: release
    if: ${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate Homebrew, Scoop and winget definitions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern "wperfk_${VERSION}_checksums.txt" --dir dist
          tools/gen-packages.sh "$VERSION" dist
          ruby -c Formula/wperfk.rb
          python3 -m json.tool bucket/wperfk.json > /dev/null

      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula bucket winget
          git diff --cached --quiet && exit 0
          git commit -m "packages: wperfk ${GITHUB_REF_NAME#v}"
          git push origin HEAD:main

      # winget-releaser only updates packages already in winget-pkgs: submit
      # winget/*.yaml by hand once (see README), then this keeps it current.
      - name: winget PR
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: SumeetChhetri.wperfk
          installers-regex: '_windows_(amd64|arm64)\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}

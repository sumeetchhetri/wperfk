name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,  os: ubuntu-24.04 }
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
          - { name: macos-arm64,   os: macos-latest }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0   # LuaJIT 2.1 derives its version from git history

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3

      - name: Build
        run: make -j4

      - name: Version
        run: ./wperfk -v || true

      - name: Smoke test
        run: tests/smoke.sh ./wperfk

      - uses: actions/upload-artifact@v4
        with:
          name: wperfk-${{ matrix.name }}
          path: wperfk

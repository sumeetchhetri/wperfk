name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,  arch: amd64, runner: ubuntu-24.04 }
          - { os: linux,  arch: arm64, runner: ubuntu-24.04-arm }
          - { os: darwin, arch: amd64, runner: macos-15-intel }
          - { os: darwin, arch: arm64, runner: macos-15 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build (Linux, static musl)
        if: matrix.os == 'linux'
        run: |
          docker run --rm -e VERSION -v "$PWD:/src" -w /src alpine:3.22 sh -ec '
            apk add --no-cache build-base perl linux-headers git openssl-dev openssl-libs-static
            git config --global --add safe.directory "*"
            make -j4 STATIC=1 VERSION="$VERSION"'
          file wperfk

      - name: Build (macOS, static OpenSSL)
        if: matrix.os == 'darwin'
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          make -j4 STATIC=1 VERSION="$VERSION"
          otool -L wperfk
          if otool -L wperfk | grep -q -e homebrew -e /usr/local/opt; then
            echo "::error::binary links against Homebrew libraries"; exit 1
          fi

      - name: Smoke test
        run: tests/smoke.sh ./wperfk

      - name: Package
        run: tools/package.sh "$VERSION" "${{ matrix.os }}" "${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: wperfk-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  build-windows:
    name: windows-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: windows-2025,   msystem: UCRT64,     cc: gcc }
          - { arch: arm64, runner: windows-11-arm, msystem: CLANGARM64, cc: clang }
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: make git zip
          pacboy: toolchain:p openssl:p python:p

      - name: Build, test, package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          make -j4 STATIC=1 CC=${{ matrix.cc }} VERSION="$VERSION"
          ./wperfk.exe -v
          if objdump -p wperfk.exe | grep "DLL Name" | grep -qiE "libssl|libcrypto|libwinpthread|libgcc|libc\+\+"; then
            echo "::error::wperfk.exe depends on non-system DLLs"; exit 1
          fi
          tests/smoke.sh ./wperfk.exe
          tools/package.sh "$VERSION" windows ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: wperfk-windows-${{ matrix.arch }}
          path: dist/*

  release:
    needs: [build, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cd dist && sha256sum wperfk_* > "wperfk_${VERSION}_checksums.txt"
          cat "wperfk_${VERSION}_checksums.txt"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/wperfk_*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes $pre

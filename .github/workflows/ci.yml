name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,  os: ubuntu-24.04 }
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
          - { name: macos-arm64,   os: macos-latest }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0   # LuaJIT 2.1 derives its version from git history

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3

      - name: Build
        run: make -j4

      - name: Version
        run: ./wperfk -v

      - name: Smoke test
        run: tests/smoke.sh ./wperfk

      - uses: actions/upload-artifact@v4
        with:
          name: wperfk-${{ matrix.name }}
          path: wperfk

  linux-musl-static:
    name: linux-x86_64-musl-static
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Build (same recipe as release)
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.22 sh -ec '
            apk add --no-cache build-base perl linux-headers git openssl-dev openssl-libs-static
            git config --global --add safe.directory "*"
            make -j4 STATIC=1'
          file wperfk
      - name: Smoke test
        run: tests/smoke.sh ./wperfk

  windows:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x86_64, runner: windows-2025,   msystem: UCRT64,     cc: gcc }
          - { name: windows-arm64,  runner: windows-11-arm, msystem: CLANGARM64, cc: clang }
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: make git zip
          pacboy: toolchain:p openssl:p python:p
      - name: Build (static, same recipe as release)
        run: |
          set -euo pipefail
          make -j4 STATIC=1 CC=${{ matrix.cc }}
      - name: Version
        run: ./wperfk.exe -v
      - name: Check DLL imports (system DLLs only)
        run: |
          set -euo pipefail
          OD=$(command -v objdump || command -v llvm-objdump)
          "$OD" -p wperfk.exe | grep "DLL Name" | sort -u
          if "$OD" -p wperfk.exe | grep "DLL Name" | grep -iE "libssl|libcrypto|libwinpthread|libgcc|libc\+\+"; then
            echo "::error::wperfk.exe depends on non-system DLLs"; exit 1
          fi
      - name: Smoke test
        run: |
          set -euo pipefail
          tests/smoke.sh ./wperfk.exe
      - uses: actions/upload-artifact@v4
        with:
          name: wperfk-${{ matrix.name }}
          path: wperfk.exe

  freebsd:
    name: freebsd-amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: vmactions/freebsd-vm@v1
        with:
          release: '14'
          copyback: false
          prepare: pkg install -y gmake bash python3 git
          run: |
            set -e
            git config --global --add safe.directory '*'
            gmake -j2 STATIC=1
            file wperfk
            ./wperfk -v
            bash tests/smoke.sh ./wperfk
